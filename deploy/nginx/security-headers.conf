# Strict transport security — 1 year, include subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# MIME-sniffing off
add_header X-Content-Type-Options "nosniff" always;

# No iframe embedding
add_header X-Frame-Options "DENY" always;

# Referrer leak control
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Deny camera/mic/geolocation/FLoC by default
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Content Security Policy
# 'unsafe-inline' for scripts is required for the anti-FOUC theme script + JSON-LD
# 'unsafe-inline' for styles is required because Framer Motion injects inline `style="..."` attrs
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
