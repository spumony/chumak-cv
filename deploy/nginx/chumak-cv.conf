server {
    listen 80;
    listen [::]:80;
    server_name chumak.is-a.dev;

    if ($host = chumak.is-a.dev) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chumak.is-a.dev;

    ssl_certificate /etc/letsencrypt/live/chumak.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chumak.is-a.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/chumak-cv/dist;
    index index.html;

    # ВАЖНО: nginx не наследует add_header в location, который объявляет свой
    # собственный add_header. Поэтому каждый location ниже, где задаётся
    # Cache-Control, обязан заново подключить сниппет с security-заголовками —
    # иначе этот путь отдаётся без HSTS, CSP и X-Frame-Options.

    # Vite SPA fallback (для будущего, если добавится client-routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Оболочка SPA обязана перепроверяться на сервере. Без этого вернувшийся
    # посетитель держит старый index.html, а значит и старый хешированный бандл.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    # Хешированные ассеты Vite — имя файла меняется вместе с содержимым,
    # поэтому кешируются навсегда.
    # `^~` обязателен: без него regex-блоки ниже перехватывают .woff2/.png
    # из /assets/ и выдают им суточный кеш вместо immutable.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Изменяемые файлы с постоянным URL: содержимое меняется, адрес — нет.
    # Должны перепроверяться, иначе правка живёт в кеше до суток.
    # Стоит выше общего regex-блока: среди regex выигрывает первый совпавший.
    location ~* ^/(og\.png|llms\.txt|Alexandr-Chumak-[A-Za-z0-9-]+\.pdf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    # Остальная статика — мягкий кеш на сутки. Один add_header вместо
    # `expires` + `add_header`, которые вместе отдавали два Cache-Control.
    location ~* \.(pdf|png|jpg|jpeg|svg|webp|woff2?|txt|xml|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
