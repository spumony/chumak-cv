    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Скажите Claude Code правило один раз. hookify будет его соблюдать.</title>
    <meta name="description" content="hookify это официальный плагин Anthropic для Claude Code, который превращает правило из обычных слов в hook. Установка, файл правила, warn и block, безопасная проверка." />
    <link rel="canonical" href="https://chumak.is-a.dev/posts/hookify/ru/" />
    <link rel="alternate" hreflang="ru" href="https://chumak.is-a.dev/posts/hookify/ru/" />

    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://chumak.is-a.dev/posts/hookify/ru/" />
    <meta property="og:title" content="Скажите Claude Code правило один раз. hookify будет его соблюдать." />
    <meta property="og:description" content="hookify это официальный плагин Anthropic для Claude Code, который превращает правило из обычных слов в hook. Установка, файл правила, warn и block, безопасная проверка." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Same pre-paint theme script as /index.html.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') t = 'light'
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#0a0a0a')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/posts/main.tsx"></script>
  </body>
</html>
