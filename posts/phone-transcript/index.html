<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Your phone's recorder can already transcribe meetings</title>
    <meta name="description" content="Where the built-in recorder on iPhone, Pixel and Samsung Galaxy shows a transcript, which models and languages it covers, and a prompt that turns it into a recap." />
    <link rel="canonical" href="https://chumak.is-a.dev/posts/phone-transcript/" />
    <link rel="alternate" hreflang="en" href="https://chumak.is-a.dev/posts/phone-transcript/" />
    <link rel="alternate" hreflang="ru" href="https://chumak.is-a.dev/posts/phone-transcript/ru/" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://chumak.is-a.dev/posts/phone-transcript/" />
    <meta property="og:title" content="Your phone's recorder can already transcribe meetings" />
    <meta property="og:description" content="Where the built-in recorder on iPhone, Pixel and Samsung Galaxy shows a transcript, which models and languages it covers, and a prompt that turns it into a recap." />
    <meta property="og:image" content="https://chumak.is-a.dev/posts/phone-transcript/og.png?v=2026-11-30" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Same pre-paint theme script as /index.html.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') t = 'light'
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#0a0a0a')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/posts/main.tsx"></script>
  </body>
</html>
