<!doctype html>
<!--
  Link previews of the post "pptx-skill". Rendered by scripts/build-post-cards.sh:
    ?size=og&lang=en   → public/posts/<slug>/og.png     (1200x627)
    ?size=og&lang=ru   → public/posts/<slug>/og-ru.png
  ?size=post is the full cheat sheet (1080x1350), not rendered by default:
  the image in the LinkedIn post comes from <slug>-hook.html.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="glow"></div>
    <div class="top">
      <span><span class="dot"></span>Claude skill</span>
      <span>chumak.is-a.dev/posts</span>
    </div>

    <h1 data-t="title"></h1>

    <div class="cols">
      <section>
        <h2 data-t="orderH"></h2>
        <ul data-list="soft"></ul>
      </section>
      <section class="hard">
        <h2 data-t="reasonH"></h2>
        <ul data-list="hard"></ul>
      </section>
    </div>

    <p class="rule" data-t="rule"></p>

    <div class="bottom">
      <span data-t="name"></span>
      <span data-t="role"></span>
    </div>

    <script>
      const T = {
        en: {
          title: 'Notes in,<br />five slides out.',
          orderH: 'You give',
          reasonH: 'You check',
          soft: [
            'a one-page summary',
            'what each slide holds',
            'your own numbers',
          ],
          hard: [
            'every figure on the slides',
            'the generic design',
            'names and dates',
          ],
          rule: 'Built-in PowerPoint skill. <b>Check the facts before you share.</b>',
          name: 'Aleksandr Chumak',
          role: 'Senior Full-Stack Engineer',
        },
        ru: {
          title: 'Заметки на входе,<br />пять слайдов на выходе.',
          orderH: 'Вы даёте',
          reasonH: 'Вы проверяете',
          soft: [
            'сводку на одну страницу',
            'что в каждом слайде',
            'свои цифры',
          ],
          hard: ['каждую цифру на слайдах', 'типовой дизайн', 'имена и даты'],
          rule: 'Встроенный скилл PowerPoint. <b>Проверьте факты до отправки.</b>',
          name: 'Александр Чумак',
          role: 'Senior Full-Stack инженер',
        },
      }
      const q = new URLSearchParams(location.search)
      const t = T[q.get('lang') === 'ru' ? 'ru' : 'en']
      document.body.className = q.get('size') === 'post' ? 'post' : 'og'
      document.querySelectorAll('[data-t]').forEach((el) => {
        el.innerHTML = t[el.dataset.t]
      })
      document.querySelectorAll('[data-list]').forEach((ul) => {
        ul.innerHTML = t[ul.dataset.list].map((x) => `<li>${x}</li>`).join('')
      })
    </script>
  </body>
</html>
