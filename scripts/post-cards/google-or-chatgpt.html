<!doctype html>
<!--
  Link previews of the post "google-or-chatgpt". Rendered by scripts/build-post-cards.sh:
    ?size=og&lang=en   → public/posts/<slug>/og.png     (1200x627)
    ?size=og&lang=ru   → public/posts/<slug>/og-ru.png
  ?size=post is the full cheat sheet (1080x1350), not rendered by default:
  the image in the LinkedIn post comes from <slug>-hook.html.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="glow"></div>
    <div class="top">
      <span><span class="dot"></span>Google · ChatGPT</span>
      <span>chumak.is-a.dev/posts</span>
    </div>

    <h1 data-t="title"></h1>

    <div class="cols">
      <section>
        <h2 data-t="orderH"></h2>
        <ul data-list="soft"></ul>
      </section>
      <section class="hard">
        <h2 data-t="reasonH"></h2>
        <ul data-list="hard"></ul>
      </section>
    </div>

    <p class="rule" data-t="rule"></p>

    <div class="bottom">
      <span data-t="name"></span>
      <span data-t="role"></span>
    </div>

    <script>
      const T = {
        en: {
          title: 'Google or ChatGPT?<br />Pick by the task.',
          orderH: 'Google first',
          reasonH: 'ChatGPT first',
          soft: ['prices and hours', 'the official page', 'a source to cite'],
          hard: [
            'a first draft',
            'a summary of notes',
            'a clause in plain words',
          ],
          rule: 'Facts you trust: <b>Google.</b> Words you edit: <b>ChatGPT.</b>',
          name: 'Aleksandr Chumak',
          role: 'Senior Full-Stack Engineer',
        },
        ru: {
          title: 'Google или ChatGPT?<br />Решает задача.',
          orderH: 'Сначала Google',
          reasonH: 'Сначала ChatGPT',
          soft: [
            'цены и часы работы',
            'официальная страница',
            'источник со ссылкой',
          ],
          hard: [
            'черновик письма',
            'краткое изложение заметок',
            'пункт договора простыми словами',
          ],
          rule: 'Факты: <b>Google.</b> Текст, который вы правите: <b>ChatGPT.</b>',
          name: 'Александр Чумак',
          role: 'Senior Full-Stack инженер',
        },
      }
      const q = new URLSearchParams(location.search)
      const t = T[q.get('lang') === 'ru' ? 'ru' : 'en']
      document.body.className = q.get('size') === 'post' ? 'post' : 'og'
      document.querySelectorAll('[data-t]').forEach((el) => {
        el.innerHTML = t[el.dataset.t]
      })
      document.querySelectorAll('[data-list]').forEach((ul) => {
        ul.innerHTML = t[ul.dataset.list].map((x) => `<li>${x}</li>`).join('')
      })
    </script>
  </body>
</html>
