<!doctype html>
<!--
  Link previews of the post "boss-gets-more". Rendered by scripts/build-post-cards.sh:
    ?size=og&lang=en   → public/posts/boss-gets-more/og.png     (1200x627)
    ?size=og&lang=ru   → public/posts/boss-gets-more/og-ru.png
  The image in the LinkedIn post comes from boss-gets-more-hook.html.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="glow"></div>
    <div class="top">
      <span><span class="dot"></span>Prompting tip</span>
      <span>chumak.is-a.dev/posts</span>
    </div>

    <h1 data-t="title"></h1>

    <div class="cols">
      <section>
        <h2 data-t="orderH"></h2>
        <ul data-list="soft"></ul>
      </section>
      <section class="hard">
        <h2 data-t="reasonH"></h2>
        <ul data-list="hard"></ul>
      </section>
    </div>

    <p class="rule" data-t="rule"></p>

    <div class="bottom">
      <span data-t="name"></span>
      <span data-t="role"></span>
    </div>

    <script>
      const T = {
        en: {
          title: 'Why your boss gets<br />more out of AI.',
          orderH: 'One line',
          reasonH: 'A short brief',
          soft: ['"Write an update"'],
          hard: ['Task', 'Who reads it', 'Done means'],
          rule: 'Brief the AI <b>like you brief a person.</b>',
          name: 'Aleksandr Chumak',
          role: 'Senior Full-Stack Engineer',
        },
        ru: {
          title: 'Почему у начальника<br />с AI получается больше.',
          orderH: 'Одна строка',
          reasonH: 'Короткое ТЗ',
          soft: ['«Напиши апдейт»'],
          hard: ['Задача', 'Кто читает', 'Что значит «готово»'],
          rule: 'Ставьте задачу AI <b>как человеку.</b>',
          name: 'Александр Чумак',
          role: 'Senior Full-Stack инженер',
        },
      }
      const q = new URLSearchParams(location.search)
      const t = T[q.get('lang') === 'ru' ? 'ru' : 'en']
      document.body.className = q.get('size') === 'post' ? 'post' : 'og'
      document.querySelectorAll('[data-t]').forEach((el) => {
        el.innerHTML = t[el.dataset.t]
      })
      document.querySelectorAll('[data-list]').forEach((ul) => {
        ul.innerHTML = t[ul.dataset.list].map((x) => `<li>${x}</li>`).join('')
      })
    </script>
  </body>
</html>
