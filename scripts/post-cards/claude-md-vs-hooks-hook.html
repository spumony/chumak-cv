<!doctype html>
<!--
  Image in the LinkedIn post (1080x1350): it has to stop the scroll.
  Rendered by scripts/build-post-cards.sh → public/posts/<slug>/linkedin.png
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      body.post h1 {
        font-size: 104px;
        letter-spacing: -3px;
        line-height: 1.02;
      }
      h1 em {
        font-style: normal;
        color: var(--accent);
      }
      .duel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: center;
        margin-top: 24px;
      }
      .note {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 44px 40px;
        background: #fde68a;
        color: #3f3f46;
        transform: rotate(-4deg);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        font-size: 64px;
        line-height: 1.15;
      }
      .note small {
        margin-top: 28px;
        font-family: 'Geist Mono', monospace;
        font-size: 24px;
        color: #78716c;
      }
      .stop {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px;
        border: 3px solid #f87171;
        border-radius: 28px;
        background: rgba(248, 113, 113, 0.08);
        font-family: 'Geist Mono', monospace;
      }
      .stop b {
        font-size: 96px;
        color: #f87171;
        letter-spacing: 4px;
      }
      .stop span {
        margin-top: 20px;
        font-size: 30px;
        color: #fecaca;
      }
      .stop small {
        margin-top: 28px;
        font-size: 24px;
        color: var(--text-muted);
      }
      .rule {
        margin-top: auto;
      }
    </style>
  </head>
  <body class="post">
    <div class="glow"></div>
    <div class="top">
      <span><span class="dot"></span>Claude Code</span>
      <span>chumak.is-a.dev/posts</span>
    </div>

    <h1>CLAUDE.md <em>asks.</em><br />A hook <em>blocks.</em></h1>

    <div class="duel">
      <div class="note">Please never run rm -rf.<small>CLAUDE.md</small></div>
      <div class="stop">
        <b>DENY</b>
        <span>rm -rf is blocked.</span>
        <small>PreToolUse hook</small>
      </div>
    </div>

    <p class="rule">Costs data or a day of work? <b>Put it in a hook.</b></p>

    <div class="bottom">
      <span>Aleksandr Chumak</span>
      <span>Senior Full-Stack Engineer</span>
    </div>
  </body>
</html>
