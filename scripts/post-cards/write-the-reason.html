<!doctype html>
<!--
  Link previews of the post "Tell it why". Rendered by scripts/build-post-cards.sh:
    ?size=og&lang=en   → public/posts/<slug>/og.png     (1200x627)
    ?size=og&lang=ru   → public/posts/<slug>/og-ru.png
  ?size=post is the full cheat sheet (1080x1350), not rendered by default:
  the image in the LinkedIn post comes from <slug>-hook.html.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="glow"></div>
    <div class="top">
      <span><span class="dot"></span>Prompting</span>
      <span>chumak.is-a.dev/posts</span>
    </div>

    <h1 data-t="title"></h1>

    <div class="cols">
      <section>
        <h2 data-t="orderH"></h2>
        <ul data-list="soft"></ul>
      </section>
      <section class="hard">
        <h2 data-t="reasonH"></h2>
        <ul data-list="hard"></ul>
      </section>
    </div>

    <p class="rule" data-t="rule"></p>

    <div class="bottom">
      <span data-t="name"></span>
      <span data-t="role"></span>
    </div>

    <script>
      const T = {
        en: {
          title: 'Stop shouting at AI.<br />Tell it why.',
          orderH: 'Order · AI guesses',
          reasonH: 'Reason · AI knows',
          soft: ['NEVER use jargon', 'Keep it SHORT', "DON'T sound salesy"],
          hard: [
            'who will read it',
            'where they read it',
            'what happened before',
            'what they should do next',
          ],
          rule: 'Give the reason. <b>It covers the cases you never listed.</b>',
          name: 'Aleksandr Chumak',
          role: 'Senior Full-Stack Engineer',
        },
        ru: {
          title: 'Не кричите на AI.<br />Объясните причину.',
          orderH: 'Приказ · AI угадывает',
          reasonH: 'Причина · AI знает',
          soft: ['НИКАКОГО жаргона', 'КОРОТКО', 'НЕ дави на продажу'],
          hard: [
            'кто будет читать',
            'где будет читать',
            'что было до этого',
            'что должен сделать',
          ],
          rule: 'Дайте причину. <b>Она покроет случаи, которых нет в правиле.</b>',
          name: 'Александр Чумак',
          role: 'Senior Full-Stack инженер',
        },
      }
      const q = new URLSearchParams(location.search)
      const t = T[q.get('lang') === 'ru' ? 'ru' : 'en']
      document.body.className = q.get('size') === 'post' ? 'post' : 'og'
      document.querySelectorAll('[data-t]').forEach((el) => {
        el.innerHTML = t[el.dataset.t]
      })
      document.querySelectorAll('[data-list]').forEach((ul) => {
        ul.innerHTML = t[ul.dataset.list].map((x) => `<li>${x}</li>`).join('')
      })
    </script>
  </body>
</html>
