<!doctype html>
<!--
  Source of the images for one post. Rendered by scripts/build-post-cards.sh:
    ?size=og&lang=en   → public/posts/<slug>/og.png        (link preview, 1200x627)
    ?size=og&lang=ru   → public/posts/<slug>/og-ru.png
    ?size=post&lang=en → public/posts/<slug>/linkedin.png  (image in the post, 1080x1350)
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="glow"></div>
    <div class="top">
      <span><span class="dot"></span>Claude Code</span>
      <span>chumak.is-a.dev/posts</span>
    </div>

    <h1 data-t="title"></h1>

    <div class="cols">
      <section>
        <h2>CLAUDE.md <span data-t="context"></span></h2>
        <ul data-list="soft"></ul>
      </section>
      <section class="hard">
        <h2>Hooks <span data-t="enforced"></span></h2>
        <ul data-list="hard"></ul>
      </section>
    </div>

    <p class="rule" data-t="rule"></p>

    <div class="bottom">
      <span data-t="name"></span>
      <span data-t="role"></span>
    </div>

    <script>
      const T = {
        en: {
          title: 'CLAUDE.md is a suggestion.<br />Hooks are rules.',
          context: '· context',
          enforced: '· enforced',
          soft: [
            'stack and folders',
            'build and test commands',
            'naming and style',
          ],
          hard: [
            '<code>rm -rf</code>, <code>push --force</code>',
            '<code>reset --hard</code>, <code>stash</code>',
            'new packages',
            '<code>.env</code> files',
          ],
          rule: 'Costs data or a day of work? <b>Put it in a hook.</b>',
          name: 'Aleksandr Chumak',
          role: 'Senior Full-Stack Engineer',
        },
        ru: {
          title: 'CLAUDE.md только советует.<br />Hooks задают правила.',
          context: '· контекст',
          enforced: '· запрет',
          soft: ['стек и папки', 'сборка и тесты', 'имена и стиль'],
          hard: [
            '<code>rm -rf</code>, <code>push --force</code>',
            '<code>reset --hard</code>, <code>stash</code>',
            'новые пакеты',
            'файлы <code>.env</code>',
          ],
          rule: 'Ошибка стоит данных или дня работы? <b>Это hook.</b>',
          name: 'Александр Чумак',
          role: 'Senior Full-Stack инженер',
        },
      }
      const q = new URLSearchParams(location.search)
      const t = T[q.get('lang') === 'ru' ? 'ru' : 'en']
      document.body.className = q.get('size') === 'post' ? 'post' : 'og'
      document.querySelectorAll('[data-t]').forEach((el) => {
        el.innerHTML = t[el.dataset.t]
      })
      document.querySelectorAll('[data-list]').forEach((ul) => {
        ul.innerHTML = t[ul.dataset.list].map((x) => `<li>${x}</li>`).join('')
      })
    </script>
  </body>
</html>
